[platformio]
src_dir = main
include_dir = include
test_dir = components/tinybft/test

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200

# Testing configuration
test_framework = unity
test_build_src = no

build_flags = 
    -DSTATIC_LOG_ALLOCATOR
    -D ESP_PLATFORM
    -D UNITY_INCLUDE_CONFIG_H

upload_port = /dev/ttyACM0
test_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_rts = 0
monitor_dtr = 0
